name: Deploy AITI to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VITE_PARTICIPATION_API_URL: ${{ vars.AITI_PARTICIPATION_API_URL || 'https://aiti-participation.gmh06-aiti.workers.dev/participation' }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check participation API
        continue-on-error: true
        run: |
          curl --fail --silent --show-error --max-time 15 "$VITE_PARTICIPATION_API_URL" | node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const { total } = JSON.parse(readFileSync(0, "utf8"));
            if (!Number.isSafeInteger(total) || total < 0) process.exit(1);
            console.log("Participation API is reachable from GitHub Actions.");
          '
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
